image:
  repository: ghcr.io/bgp-injector/speaker
  pullPolicy: IfNotPresent
  # Defaults to .Chart.AppVersion
  tag: ""

# Cluster-wide BGP defaults. All values except gateOnReady are required.
bgpDefaults:
  localAs: ""
  remoteAs: ""
  # IPv4 BGP peer address. Defaults to the node IP (status.hostIP) if not set,
  # which is appropriate when peering with the Calico node agent on the same host.
  peerAddress: ""
  # IPv6 BGP peer address. Optional; required only when announcing IPv6 prefixes
  # via a separate IPv6 session. Leave empty to use MP-BGP over the IPv4 session.
  peerAddressV6: ""
  # When true, routes are only announced while the pod's Ready condition is True.
  gateOnReady: true
  # BGP graceful restart time in seconds. When non-zero, peers hold stale routes
  # for this duration during a speaker restart, eliminating forwarding gaps.
  # Requires Calico to support graceful restart (it does by default). Set to 0 to disable.
  gracefulRestartTime: 0

# Additional environment variables to inject into the speaker container.
extraEnv: []

serviceAccount:
  create: true
  # Defaults to the fullname of the release.
  name: ""

# Rolling update strategy. maxSurge: 1 / maxUnavailable: 0 ensures a new pod
# establishes its BGP session (verified by the readiness probe) before the old
# pod is removed, preventing route withdrawals during rollouts.
updateStrategy:
  maxSurge: 1
  maxUnavailable: 0

# Minimum seconds a pod must be Ready before it is considered Available.
# Combined with the readiness probe this provides a small buffer after BGP
# establishment before the old pod is terminated.
minReadySeconds: 10

resources: {}
nodeSelector: {}
tolerations: []
affinity: {}
podAnnotations: {}

nameOverride: ""
fullnameOverride: ""
